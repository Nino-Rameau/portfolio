server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # Fichiers cachés (.DS_Store, .env...) jamais servis, sauf .well-known
    location ~ /\.(?!well-known/) {
        return 404;
    }

    absolute_redirect off;

    # Redirections 301
    location ~ ^/mentionsLegales/?$ {
        return 301 /mentions-legales$is_args$args;
    }
    location ~ ^/projets/charteGraphique/?$ {
        return 301 /projets/charte-graphique$is_args$args;
    }

    # Routes React connues (à garder synchronisées avec src/App.jsx) : 200
    location ~ ^/(competences|projets|projets/charte-graphique|cv|contact|mentions-legales)/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # "/" et fichiers statiques existants ; sinon 404
    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
